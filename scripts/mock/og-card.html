<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#08080c;color:#f2f2f5;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
    position:relative;
  }
  .glow{position:absolute;inset:0;
    background:
      radial-gradient(520px 360px at 12% 18%, rgba(139,123,255,.28), transparent 65%),
      radial-gradient(520px 360px at 92% 88%, rgba(77,141,255,.24), transparent 65%);
  }
  .grid{position:absolute;inset:0;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(70% 70% at 50% 45%,#000 40%,transparent 100%);
  }
  .inner{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:46px;height:46px;border-radius:12px}
  .brand span{font-size:23px;font-weight:700;letter-spacing:-.01em}
  .kicker{margin-top:auto;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#a89dff;font-weight:600}
  h1{margin-top:18px;font-weight:800;letter-spacing:-.03em;line-height:1.16;max-width:1010px;
     text-wrap:balance;overflow:hidden}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
        padding-top:26px;border-top:1px solid rgba(255,255,255,.12)}
  .url{font-size:20px;color:#8f8f9f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .chip{font-size:18px;color:#cfc8ff;border:1px solid rgba(139,123,255,.35);
        background:rgba(139,123,255,.12);padding:8px 16px;border-radius:999px}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="inner">
    <div class="brand">
      <img src="../../public/remotecrab-icon.png" alt="">
      <span>RemoteCrab</span>
    </div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="foot">
      <span class="url">vgoapp.com/remotecrab</span>
      <span class="chip" id="chip"></span>
    </div>
  </div>
<script>
  const p = new URLSearchParams(location.search)
  const title = p.get('t') || 'RemoteCrab'
  const kicker = p.get('k') || ''
  const chip = p.get('c') || ''
  document.getElementById('title').textContent = title
  document.getElementById('kicker').textContent = kicker
  document.getElementById('chip').textContent = chip
  document.getElementById('chip').style.display = chip ? '' : 'none'
  // 自动缩到三行以内：中文一个字宽约等于两个拉丁字符，不能只按字符数猜
  const el = document.getElementById('title')
  const box = 1010
  for (let size = 76; size >= 40; size -= 2) {
    el.style.fontSize = size + 'px'
    const lines = Math.round(el.getBoundingClientRect().height / (size * 1.16))
    if (lines <= 3 && el.scrollWidth <= box + 2) break
  }
</script>
</body>
</html>
